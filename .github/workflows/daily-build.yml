name: Daily Content Update

on:
  schedule:
    # One quality-checked refresh per day is sufficient for weekly source metrics.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Allow the workflow to push generated content back to the repo.
permissions:
  contents: write

# Prevent overlapping runs from racing on the same branch.
concurrency:
  group: daily-content-update
  cancel-in-progress: false

jobs:
  update-content:
    runs-on: ubuntu-latest
    env:
      # Repository variable may set this to any value from 0 through 20.
      DAILY_NEW_ARTICLE_LIMIT: ${{ vars.DAILY_NEW_ARTICLE_LIMIT || '5' }}
      MAX_INDEXED_ARTICLES: ${{ vars.MAX_INDEXED_ARTICLES || '500' }}
      MIN_EVIDENCE_SCORE: ${{ vars.MIN_EVIDENCE_SCORE || '50' }}
      MIN_EDITORIAL_SCORE: ${{ vars.MIN_EDITORIAL_SCORE || '70' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_EDITORIAL_MODEL: ${{ vars.AI_EDITORIAL_MODEL || '' }}
      AI_EDITORIAL_REVIEW_MODEL: ${{ vars.AI_EDITORIAL_REVIEW_MODEL || '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch data sources
        run: npx tsx scripts/fetch-all.ts

      - name: Collect source evidence
        run: npx tsx scripts/collect-evidence.ts

      - name: Generate and review articles
        run: npx tsx scripts/generate-articles.ts

      - name: Audit article additions and updates
        id: audit
        shell: bash
        run: |
          case "$DAILY_NEW_ARTICLE_LIMIT" in
            ''|*[!0-9]*)
              echo "DAILY_NEW_ARTICLE_LIMIT must be an integer from 0 through 20." >&2
              exit 1
              ;;
          esac
          if [ "$DAILY_NEW_ARTICLE_LIMIT" -gt 20 ]; then
            echo "DAILY_NEW_ARTICLE_LIMIT must not exceed 20." >&2
            exit 1
          fi

          new_count=$(git ls-files --others --exclude-standard -- 'content/articles/*.json' |
            awk '$0 != "content/articles/index.json" { count++ } END { print count+0 }')
          updated_count=$(git diff --name-only --diff-filter=M -- 'content/articles/*.json' |
            awk '$0 != "content/articles/index.json" { count++ } END { print count+0 }')
          removed_count=$(git diff --name-only --diff-filter=D -- 'content/articles/*.json' |
            awk '$0 != "content/articles/index.json" { count++ } END { print count+0 }')

          echo "new_count=$new_count" >> "$GITHUB_OUTPUT"
          echo "updated_count=$updated_count" >> "$GITHUB_OUTPUT"
          echo "removed_count=$removed_count" >> "$GITHUB_OUTPUT"
          echo "Daily content audit: new=$new_count updated=$updated_count removed=$removed_count limit=$DAILY_NEW_ARTICLE_LIMIT"
          {
            echo "### Daily content audit"
            echo "- New canonical articles: $new_count"
            echo "- Updated canonical articles: $updated_count"
            echo "- Removed article files: $removed_count"
            echo "- Configured new-article limit: $DAILY_NEW_ARTICLE_LIMIT"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$new_count" -gt "$DAILY_NEW_ARTICLE_LIMIT" ]; then
            echo "Generated $new_count new articles, exceeding the configured limit of $DAILY_NEW_ARTICLE_LIMIT." >&2
            exit 1
          fi

      - name: Run static checks
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Validate evidence and generated content
        run: npm run validate-content

      - name: Verify build succeeds
        run: npx next build

      - name: Commit and push updated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content data
          if git diff --staged --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "chore: automated daily content update [skip ci]"
            # Retry with rebase to survive concurrent pushes to master.
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:master; then
                echo "Push succeeded on attempt $attempt."
                break
              fi
              echo "Push attempt $attempt failed; rebasing on latest remote and retrying..."
              git pull --rebase origin master
              if [ "$attempt" = "5" ]; then
                echo "Push still failing after 5 attempts." >&2
                exit 1
              fi
            done
          fi
